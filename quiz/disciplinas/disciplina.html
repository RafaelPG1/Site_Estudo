<!-- quiz/disciplinas/disciplina.html — REDIRECIONADOR DE COMPATIBILIDADE (v11)
     Esta página NÃO tem mais interface nem faz parte do fluxo do Quiz.
     Ela existe só para que links/favoritos antigos continuem funcionando:
       disciplina.html?sem=X&disc=Y&modo=Z  → ../template/template.html (quiz direto)
       disciplina.html?sem=X&disc=Y         → ../quiz.html?sem=X&disc=Y (painel de modos)
       disciplina.html                      → ../quiz.html
     Pode ser apagada quando não houver mais links antigos em circulação. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Study — Quiz</title>
  <link rel="icon" type="image/x-icon" href="../../shared/img/favicons/quiz/quiz.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
  <meta name="robots" content="noindex" />
  <noscript><meta http-equiv="refresh" content="0; url=../quiz.html" /></noscript>
  <script>
    (function () {
      var MODOS = ['revisao', 'ava', 'questoes', 'enade', 'fixacao'];
      var p = new URLSearchParams(location.search);
      var sem = p.get('sem') || '', disc = p.get('disc') || '', modo = p.get('modo') || '';
      var destino;
      if (disc && sem && MODOS.indexOf(modo) !== -1) {
        destino = '../template/template.html?disc=' + encodeURIComponent(disc) +
                  '&modo=' + encodeURIComponent(modo) + '&sem=' + encodeURIComponent(sem);
      } else {
        destino = '../quiz.html' + (sem ? '?sem=' + encodeURIComponent(sem) +
                  (disc ? '&disc=' + encodeURIComponent(disc) : '') : '');
      }
      location.replace(destino);
    })();
  </script>
</head>
<body>
  <p><a href="../quiz.html">Ir para o Quiz</a></p>
</body>
</html>
