<!-- games/jogo.html — central de jogos -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Nexus Study — Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/themes/fundo.css" />
  <link rel="stylesheet" href="../shared/css/themes/semestre-picker.css" />
  <link rel="stylesheet" href="jogo.css" />
  <link rel="stylesheet" href="../shared/css/audio/audio-btns.css" />
  <link rel="stylesheet" href="../shared/css/ia/ia.css" />
</head>
<body>

  <!-- NAVEGAÇÃO LATERAL -->
  <nav class="rail" id="sidebar" aria-label="Navegação principal">
    <div id="sidebar-logo-wrap" class="rail__logo"></div>
    <ul class="rail__nav">
      <li>
        <a href="../index.html" class="rail__link" data-label="Início" aria-label="Início">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        </a>
      </li>
      <li>
        <a href="#" class="rail__link rail__link--ativo" data-label="Jogos" aria-label="Jogos" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="4"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="17.7" cy="13.7" r=".6" fill="currentColor"/></svg>
        </a>
      </li>
    </ul>
  </nav>

  <main class="main" id="main">

    <!-- BARRA SUPERIOR -->
    <header class="topbar">
      <a href="../index.html" class="voltar" aria-label="Voltar ao início">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Início</span>
      </a>
      <div class="topbar__right">
        <div id="semestre-wrap"></div>
      </div>
    </header>

    <!-- CABEÇALHO DA CENTRAL -->
    <section class="cabecalho">
      <div class="cabecalho__texto">
        <h1 class="cabecalho__titulo">Jogos</h1>
        <p class="cabecalho__sub">Escolha um jogo e comece. Para os jogos de estudo, você escolhe a disciplina em seguida.</p>
      </div>
      <img class="cabecalho__mascote" src="../shared/img/games.png" alt="" width="132" height="132" />
    </section>

    <!-- CATÁLOGO (renderizados por jogo.js) -->
    <div class="catalogo" id="catalogo" aria-live="polite"></div>

  </main>

  <!-- ESCOLHA DE DISCIPLINA -->
  <dialog class="seletor" id="seletor" aria-labelledby="seletor-titulo">
    <form method="dialog" class="seletor__caixa" id="seletor-caixa">
      <header class="seletor__topo">
        <div class="seletor__arte" id="seletor-arte" aria-hidden="true"></div>
        <div class="seletor__info">
          <h2 class="seletor__titulo" id="seletor-titulo"></h2>
          <p class="seletor__desc" id="seletor-desc"></p>
        </div>
        <button type="button" class="seletor__fechar" id="seletor-fechar" aria-label="Fechar"></button>
      </header>
      <div class="seletor__corpo">
        <p class="seletor__rotulo" id="seletor-rotulo">Escolha a disciplina</p>
        <div class="seletor__lista" id="seletor-lista" role="group" aria-labelledby="seletor-rotulo"></div>
      </div>
    </form>
  </dialog>

  <script type="module" src="jogo.js"></script>
  <script src="../shared/js/utils/quick-access.js"></script>
</body>
</html>
