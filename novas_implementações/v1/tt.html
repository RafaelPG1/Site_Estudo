<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nexus Study — Conquistas · V5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#0A0A0D;
    --bg-surface:#131217;
    --bg-surface-2:#18171D;
    --bg-tile:#16151A;
    --bg-card:#151419;
    --bg-card-hover:#1B1A21;

    --border:rgba(255,255,255,0.06);
    --border-strong:rgba(255,255,255,0.11);

    --text-primary:#EDEDF2;
    --text-secondary:#9A99A6;
    --text-tertiary:#5B5A66;

    /* single premium accent — doubles as the "legendary" tier color */
    --accent:#CBA35C;
    --accent-soft:rgba(203,163,92,0.14);

    --r-comum:#7E7D89;
    --r-incomum:#5FAD82;
    --r-rara:#5B9BD6;
    --r-epica:#9B84D9;
    --r-lendaria:#CBA35C;

    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg-page);
    font-family:'Inter', sans-serif;
    color:var(--text-primary);
    padding:56px 24px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .achievements-section{
    max-width:1180px;
    margin:0 auto;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:36px 36px 32px;
    box-shadow:0 60px 100px -60px rgba(0,0,0,0.7);
  }

  /* ================= HEADER ================= */
  .ach-header{
    display:flex; align-items:flex-start;
    gap:16px; margin-bottom:30px;
  }
  .ach-icon-badge{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(160deg, #1E1C22, #17161B);
    border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .ach-icon-badge svg{ width:20px; height:20px; stroke:var(--accent); }
  .ach-title-block h2{
    font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:600;
    margin:0 0 4px; letter-spacing:-0.01em; color:var(--text-primary);
  }
  .ach-title-block p{ margin:0; font-size:13px; color:var(--text-secondary); }

  /* ================= OVERVIEW BAR ================= */
  .overview-bar{
    display:flex; align-items:stretch;
    background:var(--bg-tile);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 28px;
    margin-bottom:26px;
    gap:0;
  }
  .ov-hero{ display:flex; align-items:center; gap:18px; padding-right:32px; }
  .ring-wrap{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-bg{ stroke:rgba(255,255,255,0.07); }
  .ring-fill{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .6s var(--ease); }
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; font-family:'Space Grotesk', sans-serif; letter-spacing:-0.02em;
  }
  .ov-hero-text .ov-title{ font-size:12px; color:var(--text-secondary); margin-bottom:3px; font-weight:500; }
  .ov-hero-text .ov-value{
    font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600; color:var(--text-primary);
    font-variant-numeric:tabular-nums;
  }
  .ov-hero-text .ov-value span{ color:var(--text-tertiary); font-weight:500; font-size:13px; }

  .ov-divider{ width:1px; background:var(--border); margin:0 28px; align-self:stretch; }

  .ov-stats{ display:flex; align-items:center; gap:32px; flex:1; }
  .ov-stat{ display:flex; align-items:center; gap:11px; }
  .ov-stat-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04);
  }
  .ov-stat-icon svg{ width:15px; height:15px; }
  .ov-stat-num{
    font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600;
    font-variant-numeric:tabular-nums; line-height:1.2;
  }
  .ov-stat-label{ font-size:11.5px; color:var(--text-secondary); }

  /* ================= CATEGORY TABS ================= */
  .cat-tabs{
    display:flex; align-items:center; gap:2px;
    background:var(--bg-tile);
    border:1px solid var(--border);
    border-radius:11px;
    padding:4px;
    margin-bottom:30px;
    width:fit-content;
    flex-wrap:wrap;
  }
  .cat-tab{
    display:flex; align-items:center; gap:7px;
    background:transparent; border:none;
    color:var(--text-secondary);
    font-size:12.5px; font-weight:500;
    padding:8px 14px; border-radius:8px; cursor:pointer;
    transition:background .18s var(--ease), color .18s var(--ease);
    font-family:'Inter', sans-serif;
  }
  .cat-tab svg{ width:14px; height:14px; opacity:0.85; }
  .cat-tab:hover{ color:var(--text-primary); }
  .cat-tab.active{ background:var(--bg-card-hover); color:var(--text-primary); box-shadow:0 1px 0 rgba(255,255,255,0.04) inset; }

  /* ================= SECTION LABEL ================= */
  .section-label{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;
  }
  .section-label h3{
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600; margin:0;
    color:var(--text-primary); letter-spacing:-0.005em;
  }
  .section-label .count{ color:var(--text-tertiary); font-weight:500; font-size:13px; margin-left:6px; }

  /* ================= FEATURED ================= */
  .featured-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:38px; }
  .featured-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:15px; padding:20px;
    display:flex; gap:16px; align-items:flex-start;
    cursor:pointer;
    transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
  }
  .featured-card:hover{ border-color:var(--border-strong); background:var(--bg-card-hover); transform:translateY(-2px); }

  .f-medal{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-surface-2);
    border:1.5px solid var(--f-color);
    position:relative;
  }
  .f-medal svg{ width:22px; height:22px; stroke:var(--f-color); position:relative; z-index:1; }
  .f-body{ flex:1; min-width:0; padding-top:2px; }
  .f-rarity{
    font-size:10.5px; font-weight:600; letter-spacing:0.03em;
    color:var(--f-color); margin-bottom:6px; display:block;
  }
  .f-body h4{ font-family:'Space Grotesk', sans-serif; font-size:14.5px; margin:0 0 5px; font-weight:600; color:var(--text-primary); }
  .f-body p{
    font-size:12px; color:var(--text-secondary); margin:0 0 13px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; min-height:34.8px;
  }
  .f-progress{ height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .f-progress-fill{ height:100%; border-radius:2px; background:var(--f-color); }
  .f-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-tertiary); font-variant-numeric:tabular-nums; }
  .f-done{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); font-weight:500; }
  .f-done svg{ width:13px; height:13px; stroke:#5FAD82; }

  /* ================= GRID ================= */
  .ach-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(128px, 1fr));
    gap:10px; margin-bottom:24px;
  }
  .ach-card{
    position:relative;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px 12px 13px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    cursor:pointer;
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
  }
  .ach-card:hover{
    transform:translateY(-2px);
    background:var(--bg-card-hover);
    border-color:var(--card-ring);
    box-shadow:0 14px 28px -18px rgba(0,0,0,0.6);
  }

  .medal{
    position:relative; width:40px; height:40px; margin-bottom:10px; flex-shrink:0;
    border-radius:50%;
    border:1.5px solid var(--card-ring);
    background:var(--bg-surface-2);
    display:flex; align-items:center; justify-content:center;
    transition:transform .22s var(--ease);
  }
  .ach-card:hover .medal{ transform:scale(1.06); }
  .medal svg{ width:17px; height:17px; stroke:var(--card-ring); opacity:0.95; }

  .ach-card[data-rarity="lendaria"] .medal::after{
    content:""; position:absolute; inset:-1.5px; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0%, rgba(203,163,92,0.5) 15%, transparent 30%);
    opacity:0; transition:opacity .3s var(--ease);
  }
  .ach-card[data-rarity="lendaria"]:hover .medal::after{ opacity:1; animation:sheen-rotate 1.8s linear; }
  @keyframes sheen-rotate{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  .legend-dot{
    position:absolute; top:-1px; right:-1px; width:8px; height:8px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg-card);
  }

  .ach-name{
    font-size:11px; font-weight:500; color:var(--text-primary);
    line-height:1.3; margin-bottom:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }

  .ach-desc{
    font-size:9.5px; font-weight:400; color:var(--text-tertiary);
    line-height:1.4; margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; min-height:26.6px;
  }
  .ach-card.state-progress .ach-desc,
  .ach-card.locked .ach-desc{ color:var(--text-tertiary); opacity:0.85; }

  .mini-progress{ width:100%; height:2.5px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
  .mini-progress-fill{ height:100%; border-radius:2px; background:var(--card-ring); opacity:0.85; }

  .hover-caption{
    font-size:9.5px; color:var(--text-tertiary); margin-top:6px;
    opacity:0; transform:translateY(-2px);
    transition:opacity .2s var(--ease), transform .2s var(--ease);
    font-variant-numeric:tabular-nums;
  }
  .ach-card:hover .hover-caption{ opacity:1; transform:translateY(0); }

  .ach-card[data-rarity="comum"]{ --card-ring:var(--r-comum); }
  .ach-card[data-rarity="incomum"]{ --card-ring:var(--r-incomum); }
  .ach-card[data-rarity="rara"]{ --card-ring:var(--r-rara); }
  .ach-card[data-rarity="epica"]{ --card-ring:var(--r-epica); }
  .ach-card[data-rarity="lendaria"]{ --card-ring:var(--r-lendaria); }

  /* estado: desbloqueada — vibrante, brilho estático discreto */
  .ach-card.state-unlocked{
    box-shadow:0 0 0 1px color-mix(in srgb, var(--card-ring) 22%, transparent);
  }
  .ach-card.state-unlocked:hover{
    box-shadow:0 0 0 1px color-mix(in srgb, var(--card-ring) 40%, transparent), 0 14px 28px -18px rgba(0,0,0,0.6);
  }

  /* estado: em andamento — intermediário, sem brilho de conclusão */
  .ach-card.state-progress .medal{ opacity:0.8; }
  .ach-card.state-progress .medal svg{ opacity:0.8; }
  .ach-card.state-progress .ach-name{ color:var(--text-secondary); }

  /* estado: bloqueada — discreta, sem revelar raridade real */
  .ach-card.locked{ --card-ring:rgba(255,255,255,0.14); opacity:0.68; }
  .ach-card.locked .medal svg{ opacity:0.45; }
  .ach-card.locked .ach-name{ color:var(--text-tertiary); }
  .ach-card.locked:hover{ box-shadow:none; opacity:0.85; }

  .hidden-card{ display:none !important; }

  /* ================= FOOTER / PAGINATION ================= */
  .ach-footer{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px;
    padding-top:20px; border-top:1px solid var(--border);
  }
  .pager{ display:flex; align-items:center; gap:4px; }
  .pager button{
    min-width:30px; height:30px; border-radius:8px;
    background:transparent; border:1px solid transparent;
    color:var(--text-tertiary); font-size:12px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s var(--ease); font-family:'Inter', sans-serif;
  }
  .pager button svg{ width:14px; height:14px; }
  .pager button:hover:not(:disabled){ color:var(--text-primary); background:var(--bg-card-hover); }
  .pager button.active{ background:var(--bg-card-hover); color:var(--text-primary); border-color:var(--border-strong); }
  .pager button:disabled{ opacity:0.3; cursor:default; }
  .pager span.ellipsis{ color:var(--text-tertiary); padding:0 4px; font-size:12px; }

  /* ================= MODAL ================= */
  .ach-modal-backdrop{
    position:fixed; inset:0; background:rgba(5,5,7,0.6); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s var(--ease); z-index:50;
  }
  .ach-modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .ach-modal{
    width:340px; background:var(--bg-surface); border:1px solid var(--border-strong);
    border-radius:18px; padding:28px;
    transform:translateY(10px) scale(0.97); transition:transform .25s var(--ease);
    text-align:center;
  }
  .ach-modal-backdrop.open .ach-modal{ transform:translateY(0) scale(1); }
  .ach-modal .medal{ width:64px; height:64px; margin:0 auto 16px; border-width:1.5px; }
  .ach-modal .medal svg{ width:26px; height:26px; }
  .ach-modal h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 6px; font-weight:600; }
  .ach-modal .m-rarity{ font-size:11px; font-weight:600; letter-spacing:0.03em; }
  .ach-modal p.desc{ font-size:13px; color:var(--text-secondary); line-height:1.55; margin:16px 0; }
  .ach-modal .meta-row{
    display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary);
    border-top:1px solid var(--border); padding:11px 0;
  }
  .ach-modal .meta-row b{ color:var(--text-primary); font-weight:500; }
  .ach-modal .close-btn{
    margin-top:16px; width:100%; background:transparent; border:1px solid var(--border-strong);
    color:var(--text-primary); padding:10px; border-radius:9px; font-size:12.5px; font-weight:500; cursor:pointer;
    transition:background .18s var(--ease);
  }
  .ach-modal .close-btn:hover{ background:rgba(255,255,255,0.03); }
</style>
</head>
<body>

<section class="achievements-section">

  <div class="ach-header">
    <div class="ach-icon-badge" id="iconTrophy"></div>
    <div class="ach-title-block">
      <h2>Conquistas</h2>
      <p>Cada marco alcançado é um passo na sua jornada de estudos.</p>
    </div>
  </div>

  <div class="overview-bar">
    <div class="ov-hero">
      <div class="ring-wrap">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="ring-bg" cx="28" cy="28" r="24" fill="none" stroke-width="3.5"></circle>
          <circle class="ring-fill" cx="28" cy="28" r="24" fill="none" stroke-width="3.5"
            stroke-dasharray="150.8" stroke-dashoffset="63.3"></circle>
        </svg>
        <div class="ring-label">58%</div>
      </div>
      <div class="ov-hero-text">
        <div class="ov-title">Progresso geral</div>
        <div class="ov-value">87<span>/150 desbloqueadas</span></div>
      </div>
    </div>

    <div class="ov-divider"></div>

    <div class="ov-stats">
      <div class="ov-stat">
        <div class="ov-stat-icon" style="color:#5FAD82;" id="iconProgress"></div>
        <div>
          <div class="ov-stat-num">12</div>
          <div class="ov-stat-label">Em andamento</div>
        </div>
      </div>
      <div class="ov-stat">
        <div class="ov-stat-icon" style="color:var(--text-tertiary);" id="iconLockedStat"></div>
        <div>
          <div class="ov-stat-num">51</div>
          <div class="ov-stat-label">Bloqueadas</div>
        </div>
      </div>
      <div class="ov-stat">
        <div class="ov-stat-icon" style="color:var(--accent);" id="iconRareStat"></div>
        <div>
          <div class="ov-stat-num">18</div>
          <div class="ov-stat-label">Raras ou superiores</div>
        </div>
      </div>
    </div>
  </div>

  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="todas">Todas</button>
    <button class="cat-tab" data-cat="desempenho">Desempenho</button>
    <button class="cat-tab" data-cat="consistencia">Consistência</button>
    <button class="cat-tab" data-cat="sequencias">Sequências</button>
    <button class="cat-tab" data-cat="tempo">Tempo de estudo</button>
    <button class="cat-tab" data-cat="conhecimento">Conhecimento</button>
    <button class="cat-tab" data-cat="exploracao">Exploração</button>
  </div>

  <div class="section-label">
    <h3>Em destaque</h3>
  </div>
  <div class="featured-row" id="featuredRow"></div>

  <div class="section-label">
    <h3>Todas as conquistas<span class="count" id="gridCount"></span></h3>
  </div>
  <div class="ach-grid" id="achGrid"></div>

  <div class="ach-footer">
    <div class="pager" id="pager"></div>
  </div>
</section>

<div class="ach-modal-backdrop" id="modalBackdrop">
  <div class="ach-modal" id="modalContent"></div>
</div>

<script>
/* ---------- consistent stroke-icon system (Feather-style, 1.8px stroke) ---------- */
const svgWrap = (inner, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;

const ICON_PATHS = {
  trophy: `<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 3"/><path d="M17 5h3a3 3 0 0 1-3 3"/>`,
  hourglass: `<path d="M6 3h12"/><path d="M6 21h12"/><path d="M7 3c0 5.5 5 6 5 9s-5 3.5-5 9"/><path d="M17 3c0 5.5-5 6-5 9s5 3.5 5 9"/>`,
  lock: `<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>`,
  gem: `<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M9 3l3 6 3-6"/>`,
  check: `<polyline points="20 6 9 17 4 12"/>`,
  chevronLeft: `<polyline points="15 18 9 12 15 6"/>`,
  chevronRight: `<polyline points="9 18 15 12 9 6"/>`,
  trending: `<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>`,
  calendar: `<rect x="3" y="4.5" width="18" height="16" rx="2"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/>`,
  flame: `<path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1.5-1-2-1-3.5 2 1.5 3 4 3 6.5a5 5 0 0 1-10 0c0-4 3-6 5-11z"/>`,
  clock: `<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>`,
  book: `<path d="M2 5.5h7a3 3 0 0 1 3 3V20a2.2 2.2 0 0 0-2-1.4H2z"/><path d="M22 5.5h-7a3 3 0 0 0-3 3V20a2.2 2.2 0 0 1 2-1.4h8z"/>`,
  compass: `<circle cx="12" cy="12" r="9"/><polygon points="15 9 12.5 12.5 9 15 11.5 11.5"/>`,
};
const icon = (name, extra='') => svgWrap(ICON_PATHS[name], extra);

document.getElementById('iconTrophy').innerHTML = icon('trophy');
document.getElementById('iconProgress').innerHTML = icon('hourglass');
document.getElementById('iconLockedStat').innerHTML = icon('lock');
document.getElementById('iconRareStat').innerHTML = icon('gem');

/* ---------- data model ---------- */
const CATS = [
  { id:'desempenho', label:'Desempenho', icon:'trending' },
  { id:'consistencia', label:'Consistência', icon:'calendar' },
  { id:'sequencias', label:'Sequências', icon:'flame' },
  { id:'tempo', label:'Tempo de estudo', icon:'clock' },
  { id:'conhecimento', label:'Conhecimento', icon:'book' },
  { id:'exploracao', label:'Exploração', icon:'compass' },
];
const RARITIES = ['comum','incomum','rara','epica','lendaria'];
const RARITY_LABEL = { comum:'Comum', incomum:'Incomum', rara:'Rara', epica:'Épica', lendaria:'Lendária' };

function pickRarity(i){
  const r = (i * 47) % 100 / 100;
  let acc = 0;
  for(let k=0;k<RARITIES.length;k++){ acc += rarityWeight[k]; if(r <= acc) return RARITIES[k]; }
  return RARITIES[0];
}

let data = [];
const TOTAL = 130;
for(let i=0;i<TOTAL;i++){
  const cat = CATS[i % CATS.length];
  const rarity = pickRarity(i);

  // distribuição realista: ~36% desbloqueadas, ~24% em andamento, ~40% bloqueadas
  const bucket = (i * 71) % 100;
  let status;
  if(bucket < 36) status = 'unlocked';
  else if(bucket < 60) status = 'progress';
  else status = 'locked';

  const unlocked = status === 'unlocked';
  const progress = status === 'progress' ? 10 + ((i*31)%80) : null;

  const meta = ACHIEVEMENT_META[i % ACHIEVEMENT_META.length];

  data.push({
    id:i, name: meta.name, shortDesc: meta.short, fullDesc: meta.full,
    cat, rarity, unlocked, status, progress,
    date: unlocked ? `${(i%27)+1} mai 2026` : null,
    requirement: status === 'progress' ? `${Math.round(progress)}/100 concluído` : (status === 'unlocked' ? 'Concluído' : 'Detalhes revelados ao progredir'),
  });
}

/* ---------- grid + pagination ---------- */
let activeCat = 'todas';
let currentPage = 1;
const pageSize = 20;

function filteredData(){ return activeCat === 'todas' ? data : data.filter(d => d.cat.id === activeCat); }

function renderGrid(){
  const items = filteredData();
  document.getElementById('gridCount').textContent = ` · ${items.length}`;
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * pageSize;
  const pageItems = items.slice(start, start + pageSize);

  const grid = document.getElementById('achGrid');
  grid.innerHTML = '';
  pageItems.forEach(item => {
    const card = document.createElement('div');
    const stateClass = item.status === 'unlocked' ? 'state-unlocked' : (item.status === 'progress' ? 'state-progress' : 'locked');
    card.className = 'ach-card ' + stateClass;
    card.dataset.rarity = item.rarity;
    card.tabIndex = 0;

    // conquistas totalmente bloqueadas não revelam o ícone real da categoria
    const showLockIcon = item.status === 'locked';

    const caption = item.status === 'unlocked'
      ? (item.date || '')
      : (item.status === 'progress' ? `${Math.round(item.progress)}/100` : 'Bloqueada');

    card.innerHTML = `
      ${item.rarity === 'lendaria' && item.status === 'unlocked' ? '<span class="legend-dot"></span>' : ''}
      <div class="medal">${icon(showLockIcon ? 'lock' : (item.customIcon || item.cat.icon))}</div>
      <div class="ach-name">${item.name}</div>
      <div class="ach-desc">${item.shortDesc}</div>
      ${item.progress ? `<div class="mini-progress"><div class="mini-progress-fill" style="width:${item.progress}%;"></div></div>` : ''}
      <div class="hover-caption">${caption}</div>
    `;
    card.addEventListener('click', () => openModal(item));
    card.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(item); } });
    grid.appendChild(card);
  });

  renderPager(totalPages);
}

function renderPager(totalPages){
  const pager = document.getElementById('pager');
  pager.innerHTML = '';

  const mkBtn = (content, page, opts={}) => {
    const b = document.createElement('button');
    b.innerHTML = content;
    if(opts.active) b.classList.add('active');
    if(opts.disabled) b.disabled = true;
    b.addEventListener('click', () => { currentPage = page; renderGrid(); });
    return b;
  };

  pager.appendChild(mkBtn(icon('chevronLeft'), currentPage - 1, { disabled: currentPage === 1 }));

  const pages = [];
  for(let p=1; p<=totalPages; p++){ if(p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p); }
  let last = 0;
  pages.forEach(p => {
    if(p - last > 1){
      const span = document.createElement('span'); span.className = 'ellipsis'; span.textContent = '…';
      pager.appendChild(span);
    }
    pager.appendChild(mkBtn(String(p), p, { active: p === currentPage }));
    last = p;
  });

  pager.appendChild(mkBtn(icon('chevronRight'), currentPage + 1, { disabled: currentPage === totalPages }));
}

document.getElementById('catTabs').addEventListener('click', e => {
  const btn = e.target.closest('.cat-tab');
  if(!btn) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  currentPage = 1;
  renderGrid();
});

/* ---------- modal ---------- */
const backdrop = document.getElementById('modalBackdrop');
const modalContent = document.getElementById('modalContent');

function openModal(item){
  const showLockIcon = item.status === 'locked';
  const ringVar = `var(${RARITY_VAR[item.rarity]})`;

  modalContent.innerHTML = `
    <div class="medal" style="border-color:${ringVar}; --card-ring:${ringVar};">${icon(showLockIcon ? 'lock' : (item.customIcon || item.cat.icon))}</div>
    <h3>${item.name}</h3>
    <div class="m-rarity" style="color:${ringVar};">${RARITY_LABEL[item.rarity]} · ${item.cat.label}</div>
    <p class="desc">${item.fullDesc}</p>
    ${item.progress ? `<div class="mini-progress" style="height:4px; margin-bottom:14px;"><div class="mini-progress-fill" style="width:${item.progress}%; background:${ringVar};"></div></div>` : ''}
    <div class="meta-row"><span>Requisito</span><b>${item.requirement}</b></div>
    <div class="meta-row" style="border-bottom:1px solid var(--border);"><span>${item.status === 'unlocked' ? 'Desbloqueada em' : 'Status'}</span><b>${item.status === 'unlocked' ? item.date : (item.status === 'progress' ? 'Em andamento' : 'Bloqueada')}</b></div>
    <button class="close-btn" id="closeModalBtn">Fechar</button>
  `;
  backdrop.classList.add('open');
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
}
function closeModal(){ backdrop.classList.remove('open'); }
backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

renderGrid();
